version: '3.8'

services:
  # 1. MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: theme_marketplace_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_secure
      MYSQL_DATABASE: theme_marketplace
      MYSQL_USER: theme_user
      MYSQL_PASSWORD: theme_password_secure
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/01_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword_secure"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: theme_marketplace_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend API (NestJS / Node.js Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: theme_marketplace_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: theme_marketplace
      DB_USER: theme_user
      DB_PASSWORD: theme_password_secure
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - app_network

  # 4. Frontend Storefront (Next.js 15)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: theme_marketplace_frontend
    restart: unless-stopped
    command: npm run dev
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - app_network

  # 5. MinIO (S3-Compatible Local Object Storage for Theme Packages)
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: theme_marketplace_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. MinIO Bucket Initializer (Auto-creates theme-dist-packages bucket)
  minio-init:
    image: minio/mc:RELEASE.2024-03-03T17-50-39Z
    container_name: theme_marketplace_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/theme-dist-packages;
      /usr/bin/mc anonymous set download local/theme-dist-packages;
      echo 'MinIO theme-dist-packages bucket initialized successfully!';
      exit 0;
      "
    networks:
      - app_network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  app_network:
    driver: bridge
