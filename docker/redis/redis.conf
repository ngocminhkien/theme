# =====================================================================
# REDIS CONFIGURATION: THEME MARKETPLACE PLATFORM
# Optimized for Catalog Caching, Session Store, Rate Limiting & Webhooks
# =====================================================================

# 1. NETWORK & GENERAL
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice

# 2. MEMORY MANAGEMENT
# Giới hạn bộ nhớ tối đa cho Redis cache (256MB)
maxmemory 256mb

# Chiến lược giải phóng bộ nhớ khi đạt ngưỡng maxmemory:
# allkeys-lru: Xóa các key ít sử dụng nhất (LRU) trên toàn bộ không gian key
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 3. PERSISTENCE (RDB & AOF)
# Snapshot định kỳ vào đĩa cứng (dump.rdb)
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Bật Append Only File (AOF) để chống mất mát dữ liệu giao dịch/webhook
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 4. PERFORMANCE & CLIENTS
maxclients 10000
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
