user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # File Upload size (Hỗ trợ upload theme zip lên đến 100MB)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (Chống spam và DDoS)
    # 1. API Chung: tối đa 60 requests / phút
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    # 2. Checkout & Webhook: tối đa 15 requests / phút
    limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=15r/m;
    # 3. Download link & Token check: tối đa 20 requests / phút
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=20r/m;

    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
